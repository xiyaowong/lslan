name: Release

# 打 v* tag 即构建发布:更新产物(签名归档、delta、update-*.json)由
# mygo build -upload 直接传到 draft release,清单是应用内自动更新的
# feed;上传完整后自动 publish,更新即对已装用户可见。见 RELEASE.md。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release and its files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-check compares the tag with main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 坏代码不该发到全体用户手上:版本号一致、tag 在 main 上、检查通过,再构建。
      - name: Checks
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { Write-Output $bad; exit 1 }
          go vet ./...
          if ($LASTEXITCODE) { exit 1 }
          go test ./...
          if ($LASTEXITCODE) { exit 1 }
      # 扫描器和 UI 都是并发跑的,数据竞争只有这个构建标志能抓到。
      # 它又需要 cgo,所以单列一步,与上面的普通测试分开。
      - name: Race
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Version and tag agree
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          $json = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $top = (Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+)' | Select-Object -First 1).Matches.Groups[1].Value
          $bad = $false
          if ($json -ne $v) { Write-Output "mygo.json 是 $json,与 tag $v 不一致"; $bad = $true }
          if ($top -ne $v) { Write-Output "CHANGELOG 顶部是 $top,与 tag $v 不一致"; $bad = $true }
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { Write-Output "tag 不在 main 上"; $bad = $true }
          if ($bad) { exit 1 }
      # gh 供 mygo build -upload 传产物;token 供其 API 调用。
      - name: Build and upload
        shell: pwsh
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -upload -platform windows/amd64
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false --latest=false
